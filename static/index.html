<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>숨결 편집기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <b class="logo">숨결 편집기</b>
  <input id="projName" value="새 프로젝트" title="프로젝트 이름">
  <select id="aspect" title="화면 비율"><option value="1080x1920">세로 9:16</option><option value="1920x1080">가로 16:9</option><option value="1080x1080">정사각 1:1</option></select>
  <button id="btnNew">새로</button><button id="btnOpen">열기</button><button id="btnSave">저장</button><button id="btnSnd" title="소리가 안 들릴 때">🔊 점검</button><button id="btnExport" title="지금 편집한 그대로 실제 속도로 녹화해서 mp4로 저장(검토용)">🎬 미리보기 영상</button>
  <span id="saveState" class="dim"></span>
  <span class="grow"></span>
  <span id="keyState" class="dim"></span><button id="btnKeys">🔑 키 설정</button>
</header>
<main>
  <section id="left">
    <nav class="tabs"><button data-tab="media" class="on">미디어</button><button data-tab="sent">문장</button><button data-tab="script">대본 추천</button><button data-tab="find">영상 찾기</button></nav>
    <div id="tab-media" class="tab on">
      <div class="row"><button id="btnPick">＋ 파일 가져오기</button></div>
      <div class="row"><button id="btnSrt">＋ 자막(.srt) 불러오기</button><input id="srtFile" type="file" accept=".srt,.txt" class="hidden"></div>
      <div id="mediaList"></div>
    </div>
    <div id="tab-sent" class="tab">
      <p class="dim" style="font-size:12px;margin:4px 0">문장(자막)을 고치고, 문장마다 화면을 찾거나 Veo 프롬프트를 받아요. 고친 글은 바로 저장돼요.</p>
      <div id="sentList"></div>
    </div>
    <div id="tab-script" class="tab">
      <label>채널 <select id="chSel"></select></label>
      <label>주제 <input id="topic" placeholder="예: 해달, 흰동가리, 스프링클러"></label>
      <p class="dim" style="margin:10px 0 4px">영상 먼저 → 대본</p>
      <div class="row"><input id="folder" placeholder="폴더(예: 지구_23_흰동가리)"><input id="nClip" type="number" value="12" min="4" max="30" title="모을 영상 수" style="max-width:60px"></div>
      <button id="btnCollect">① 주제로 영상 모으기</button>
      <div id="colState" class="dim" style="font-size:12px;margin:4px 0"></div>
      <div class="row"><button id="btnFromMedia">② 이 영상들로 대본 추천</button><input id="nSent" type="number" value="14" min="5" max="30" title="문장 수" style="max-width:60px"></div>
      <div id="recOut"></div>
      <button id="btnCredits" style="margin-top:10px">📋 이 폴더 출처 문구</button>
      <details style="margin-top:12px"><summary class="dim">영상 없이 대본만 추천</summary><button id="btnRec" style="margin-top:6px">대본 추천 받기</button></details>
    </div>
    <div id="tab-find" class="tab">
      <div class="row"><input id="q" placeholder="검색어(영어), 예: sea otter"><select id="src"><option value="pixabay">Pixabay</option><option value="commons">위키미디어 공용</option><option value="nasa">NASA</option><option value="pexels">Pexels(키 필요)</option></select></div>
      <div class="row"><select id="orient"><option value="">모든 방향</option><option value="portrait">세로</option><option value="landscape">가로</option></select><button id="btnFind">찾기</button></div>
      <div class="row" style="font-size:12px"><select id="condLv" title="사용 조건"><option value="attrib">출처 표시하면 되는 것까지</option><option value="free">조건 없는 것만(출처 표시 불필요)</option></select>
      <label style="display:flex;gap:4px;align-items:center;white-space:nowrap"><input id="condRv" type="checkbox" style="width:auto">검토 전 포함</label></div>
      <button id="btnWonder" style="width:100%;margin:4px 0 4px">✨ 신기한 영상 둘러보기</button>
      <label style="display:flex;gap:6px;align-items:center;font-size:12px;margin:2px 0"><input id="autoSc" type="checkbox" checked style="width:auto"> 받으면 바로 대본 추천해서 넣기</label>
      <div id="autoState" class="dim" style="font-size:12px;margin-bottom:6px"></div>
      <div id="findOut" class="grid"></div>
      <p class="dim" style="margin:14px 0 4px;font-size:12px">키 없이 Pexels 영상 받기: 영상 페이지 주소나 번호를 붙여 넣어요(여러 개는 줄바꿈)</p>
      <textarea id="pxUrls" style="width:100%;min-height:60px;background:#262b34;color:var(--fg);border:1px solid var(--line);border-radius:6px" placeholder="https://www.pexels.com/video/...-8104898/"></textarea>
      <button id="btnPx">Pexels에서 받기</button> <span id="pxState" class="dim" style="font-size:12px"></span>
    </div>
  </section>
  <section id="center">
    <div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
    <div id="transport">
      <button id="btnPlay" title="재생/멈춤 (스페이스)">▶</button>
      <span id="tc">00:00.00</span> / <span id="tdur">00:00.00</span>
      <span class="grow"></span>
      <button id="btnCut" title="잘라내기 (Ctrl+X) — 뒤 클립을 당겨요">✂︎ 잘라내기</button><button id="btnCopy" title="복사 (Ctrl+C)">⧉ 복사</button><button id="btnPaste" title="붙여넣기 (Ctrl+V) — 재생선 자리에 끼워 넣고 뒤를 밀어요. Shift+Ctrl+V = 덮어쓰기">📋 붙이기</button><button id="btnFill" title="영상 트랙의 검은 틈을 앞뒤 클립을 늘려 채워요. 자막·목소리 싱크는 그대로">↔ 빈틈 메우기</button><button id="btnGap" title="영상 트랙의 빈틈을 없애고 뒤 클립을 당겨 붙여요(자막과 어긋날 수 있어요)">⇤ 당겨 붙이기</button>
      <button id="btnXfAll" title="모든 영상 사이를 0.5초씩 서서히 바뀌게">◐ 전환 일괄</button>
      <button id="btnSplit" title="재생선에서 나누기 (S, C, Ctrl+K)">| 나누기</button>
      <button id="btnText" title="글자 추가 (T)">T 글자</button>
      <button id="btnDel" title="지우기 (Delete)">🗑</button>
      <button id="btnUndo" title="되돌리기 (Ctrl+Z)">↶</button><button id="btnRedo" title="다시 (Ctrl+Y)">↷</button>
    </div>
  </section>
  <section id="right">
    <h3>속성</h3>
    <div id="insp" class="dim">클립을 고르면 여기서 고쳐요.</div>
  </section>
</main>
<footer id="tl">
  <div id="tlHead"><span>타임라인</span><span class="grow"></span><label>확대 <input id="zoom" type="range" min="10" max="300" value="60"></label></div>
  <div id="tlBody">
    <div id="ruler"></div>
    <div id="tracks"></div>
    <div id="playhead"></div>
  </div>
</footer>
<div id="modal" class="hidden"><div class="box"><div id="modalBody"></div><div class="row end"><button id="modalClose">닫기</button></div></div></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
